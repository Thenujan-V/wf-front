<f-flow fDraggable (fCreateConnection)="onConnect($event)" (fReassignConnection)="onReassign($event)"
        (fMoveNodes)="onMove($event)" (fSelectionChange)="onSelection($event)">
  <f-canvas fZoom>
    <f-connection-for-create />
    @for (edge of graph().edges; track edge.id) {
      <f-connection [fConnectionId]="edge.id" [fSourceId]="'out:' + edge.source" [fTargetId]="'in:' + edge.target"
                    [attr.data-testid]="'edge-' + edge.id" [class.edge-selected]="edge.id === selectedEdge()">
        <f-connection-marker-arrow type="end" />
        <div fConnectionContent [position]="0.5" class="rounded bg-surface px-1 text-[11px] text-muted" [class.hidden]="!edgeLabel(edge)">{{ edgeLabel(edge, nodeNames()) }}</div>
      </f-connection>
    }
    @for (node of graph().nodes; track node.id) {
      <div fNode fDragHandle [fNodeId]="node.id" [fNodePosition]="node.position ?? origin"
           [attr.data-testid]="'node-' + node.id"
           [attr.data-problem]="problemNodes().has(node.id) || null"
           [attr.data-selected]="node.id === selectedNode() || null"
           class="relative w-40 border-2 px-3 py-2 text-center text-ink shadow-sm {{ shape(node.type) }}"
           [class.ring-2]="problemNodes().has(node.id) || node.id === selectedNode()"
           [class.ring-danger]="problemNodes().has(node.id)"
           [class.ring-accent]="node.id === selectedNode() && !problemNodes().has(node.id)">
        @if (node.type !== 'START') {
          <div fConnector fConnectorType="target" [fConnectorId]="'in:' + node.id" [fConnectorMultiple]="true" data-connector="in"
               class="absolute -left-1.5 top-1/2 h-3 w-3 -translate-y-1/2 rounded-full border-2 border-surface bg-muted"></div>
        }
        <span class="block text-[10px] uppercase tracking-wide text-muted">{{ typeLabel(node.type) }}</span>
        <span class="block truncate text-sm font-medium">{{ node.name }}</span>
        @if (node.type !== 'END') {
          <div fConnector fConnectorType="source" [fConnectorId]="'out:' + node.id" [fConnectorMultiple]="true" data-connector="out"
               class="absolute -right-1.5 top-1/2 h-3 w-3 -translate-y-1/2 rounded-full border-2 border-surface bg-muted"></div>
        }
      </div>
    }
  </f-canvas>
</f-flow>
