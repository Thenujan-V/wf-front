<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auradot Workflow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <script>
    // The theme is set before the first paint, so the page never flashes in the wrong one. ThemeService uses the
    // same key and the same rule.
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem('wms.theme');
      } catch (e) {
        // storage blocked
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
